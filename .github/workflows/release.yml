name: nullnet Surum Yayinla

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Sürüm kodu (her yeni sürümde +1)"
        type: number
        required: true
      versionName:
        description: "Sürüm adı (örn: 1.1.0)"
        type: string
        required: true
      notes:
        description: "Sürüm notları"
        type: string
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Imzalama maddeleri
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" \
            > keystore.properties

      - name: Versiyon bilgisi
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=${{ inputs.versionName }}" >> "$GITHUB_ENV"
            echo "VERSION_CODE=${{ inputs.versionCode }}" >> "$GITHUB_ENV"
            echo "TAG=v${{ inputs.versionName }}" >> "$GITHUB_ENV"
          fi

      - name: Release APK derle (imzali)
        env:
          UPDATE_PUB_KEY: ${{ secrets.UPDATE_PUBLIC_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            -PupdateUrl="https://github.com/${{ github.repository }}/releases/latest/download/update.json" \
            -PupdatePubKey="${UPDATE_PUB_KEY}"

      - name: Imzali guncelleme bildirimi (update.json)
        env:
          UPDATE_PRIV: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          python -m pip install --quiet cryptography
          echo "${UPDATE_PRIV}" | base64 -d > tools/update_key_private.b64
          python tools/make_update.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --url "https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk" \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --notes "${{ inputs.notes }}" \
            --out update.json

      - name: GitHub Release yayinla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            update.json \
            --repo "${{ github.repository }}" \
            --title "v$VERSION_NAME" \
            --notes "${{ inputs.notes }}"